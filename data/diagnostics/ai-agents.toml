    return int(response.content[0].text)
```
"""
options = [
  "Cálculo determinístico feito por LLM: pode variar, pode errar, e custa caro sem nenhum ganho",
  "O `max_tokens` está baixo demais para o número caber",
  "O prompt deveria estar em inglês para gastar menos tokens",
  "Falta ligar o pensamento estendido para melhorar a precisão do cálculo",
]
answer = 1
explanation = "Existe uma fórmula exata: uma função pura resolve em microssegundos, de graça, com teste e sempre igual. Aqui o LLM é risco puro, ainda por cima em dinheiro."

