[[questions]]
slug = "binary-search-off-by-one"
competency = "searching-and-sorting"
kind = "debugging"
prompt = '''
`busca_binaria([1, 3, 5], 5)` devolve `-1`, mas o 5 está na lista. Qual correção resolve?

```python
def busca_binaria(itens, alvo):
    inicio, fim = 0, len(itens) - 1
    while inicio < fim:
        meio = (inicio + fim) // 2
        if itens[meio] == alvo:
            return meio
        if itens[meio] < alvo:
            inicio = meio + 1
        else:
            fim = meio - 1
    return -1
```
'''
options = [
  "Trocar while inicio < fim por while inicio <= fim",
  "Trocar // por / no cálculo do meio",
  "Trocar inicio = meio + 1 por inicio = meio",
  "Trocar fim = meio - 1 por fim = meio",
]
answer = 1
explanation = "Quando inicio == fim ainda sobra um item para olhar. Com < o laço para antes de testá-lo."

