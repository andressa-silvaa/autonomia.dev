[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hone"
version = "0.1.0"
description = "Sistema Pessoal de Formação em TI — mede competência e autonomia, não só conteúdo concluído."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "python-dotenv>=1.0",
    "markdown-it-py>=3.0",
    "networkx>=3.4",
    "pytest>=8.3",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28",
    "ruff>=0.8",
]

[project.scripts]
hone = "hone.cli:app"

[tool.setuptools.packages.find]
include = ["hone*"]

[tool.setuptools.package-data]
"hone.core" = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"exercises/**/starter.py" = ["B"]
